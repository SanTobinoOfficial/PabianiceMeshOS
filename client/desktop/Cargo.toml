[package]
name = "pabianice-desktop"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "pabianice"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

[build-dependencies]
cc = "1"
