name: Deploy GitHub Pages

on:
  push:
    branches: [claude/pabianice-comms-start-slq0jn]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# klasyczny tryb "Deploy from a branch" zamiast Pages-przez-Actions - ten drugi wymaga
# od GITHUB_TOKEN uprawnien administracyjnych ktorych domyslny token joba nie ma
# ("Resource not accessible by integration" przy probie stworzenia Pages site przez API,
# sprawdzone w praktyce dwa razy). Zwykly `contents: write` + push na gh-pages dziala
# zawsze, bo to nie API Pages, tylko zwykly git push.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publikuj website/ na branchu gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website
          publish_branch: gh-pages
