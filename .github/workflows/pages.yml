name: Deploy GitHub Pages

on:
  push:
    branches: [claude/pabianice-comms-start-slq0jn]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jeden deploy na raz - kolejny push nie powinien przerywać trwającego wdrożenia
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # domyślnie ta akcja tylko odczytuje istniejącą konfigurację Pages, nie
          # włącza jej - repo jeszcze nigdy nie miało Pages ustawionego, więc trzeba
          # jawnie kazać jej to zrobić
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
