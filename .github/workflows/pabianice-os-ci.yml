name: Pabianice OS CI

on:
  push:
    branches: [claude/pabianice-comms-start-slq0jn]
    paths:
      - "pabianice-os/server/**"
      - ".github/workflows/pabianice-os-ci.yml"
  pull_request:
    paths:
      - "pabianice-os/server/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pabianice-os/server
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pabianice-os/server

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
