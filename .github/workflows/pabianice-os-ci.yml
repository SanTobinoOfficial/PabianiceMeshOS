name: Pabianice OS CI

on:
  push:
    branches: [claude/pabianice-comms-start-slq0jn]
    paths:
      - "pabianice-os/server/**"
      - ".github/workflows/pabianice-os-ci.yml"
  pull_request:
    paths:
      - "pabianice-os/server/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pabianice-os/server
    # kilka testow (routes/users.rs, routes/messages.rs) to sqlx::test - realne
    # integracyjne testy na tymczasowej bazie, nie tylko czysta logika jak w /server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pabianice-os/server

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
